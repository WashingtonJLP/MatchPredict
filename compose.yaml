services:

  backend:
    build:
      context: ./backend
    container_name: matchpredict-backend
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:3001:3000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: matchpredict-frontend
    ports:
      - "3002:3000"
    restart: unless-stopped
    depends_on:
      - backend

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-production
    network_mode: host
    restart: unless-stopped
    environment:
      HOME: /home/nonroot
    volumes:
      - ./cloudflared:/home/nonroot/.cloudflared
    command:
      - tunnel
      - --config
      - /home/nonroot/.cloudflared/config.yml
      - run
      - matchpredict-production
    depends_on:
      - frontend
      - backend
