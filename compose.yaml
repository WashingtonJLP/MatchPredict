services:

  backend:
    build:
      context: ./backend
    container_name: matchpredict-backend
    env_file:
      - ./backend/.env
    ports:
      - "3001:3000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: matchpredict-frontend
    ports:
      - "3002:3000"
    restart: unless-stopped
    depends_on:
      - backend